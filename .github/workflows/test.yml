name: Run Tests

# 1. When should this workflow run?
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. What jobs should it do?
jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Step A: Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step B: Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
          cache: 'npm'

      # Step C: Install dependencies (Jest)
      - name: Install Dependencies
        run: npm ci

      # Step D: Run the tests!
      - name: Run Jest Tests
        run: npm test